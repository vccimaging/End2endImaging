site_name: End2endImaging
site_description: "End-to-end differentiable simulation framework for computational imaging"
site_author: "Xinge Yang"
site_url: https://vccimaging.github.io/End2endImaging/
repo_url: https://github.com/vccimaging/End2endImaging
repo_name: vccimaging/End2endImaging

docs_dir: docs

theme:
  name: material
  favicon: assets/logo.png
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source
            heading_level: 3
            separate_signature: true
            merge_init_into_class: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list

extra_css:
  - stylesheets/api.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - API Reference:
      - DeepLens: api/deeplens.md
      - Sensor: api/sensor.md
      - Network: api/network.md
      - Camera: api/camera.md
  - Examples:
      - Overview: examples/index.md
      - End-to-End Lens Design: examples/end2end_lens_design.md
      - Automated Lens Design: examples/autolens.md
      - PSF Surrogate Network: examples/psf_net.md
      - Task-Driven Lens Design: examples/task_driven.md
      - Hybrid Lens Design: examples/hybrid_lens.md
      - Computational Photography: examples/comp_photography.md
  - Contributing: contributing.md
